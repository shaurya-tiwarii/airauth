services:
  - type: web
    name: airauth-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirement.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AIRAUTH_JWT_SECRET
        generateValue: true
      - key: AIRAUTH_MASTER_KEY
        generateValue: true
      - key: AIRAUTH_CORS_ORIGINS
        value: https://airauth-web.onrender.com

  - type: web
    name: airauth-web
    runtime: static
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://airauth-api.onrender.com
